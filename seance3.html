<!DOCTYPE html>
<html lang="en">
<!-- Remarque : Le contenu du devoir est en français, il est préférable d'utiliser lang="fr". -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>devoir3</title>
</head>

<body>

    <header>
        <h1>Formulaire d'Inscription</h1>
    </header>

    <main>

    <forme>
    <!-- Remarque importante : La balise <forme> n'existe pas en HTML. Il faut utiliser <form>. -->

    <div>
        <label>Nom :</label>
        <input type="text" placeholder="votre nom complet" required>
        <br><br>
    </div>

    <div>
        <label>Email :</label>
        <input type="text" placeholder="exemple@mail.com" required>
        <!-- Remarque : Pour un email, utilisez type="email" plutôt que type="text". -->
        <br><br>
    </div>

    <div>
        <label>Mot de pass :</label>
        <input type="password">
        <br><br>
    </div>

    <div>
        <label>Age :</label>
        <input type=" number">
        <!-- Remarque : Il y a un espace dans type=" number". Il faut écrire type="number". -->
        <br><br>
    </div>

    <div>
        <label>Date de naissance :</label>
        <input type="date">
        <br><br>
    </div>

    <div>
        <label>Coleur préférée :</label>
        <input type="color">
        <br><br>
    </div>

    <div>
        <label>Volume préférée :</label>
        <input type="range">
        <br><br>
    </div>

    <div>
        <label>Photo de profile :</label>
        <input type="file">
        <br><br>
    </div>

    <div>
        <label>Genre :</label>
        <br>

        <input type="radio" name="sexe" value="femme"> femme
        <br>

        <input type="radio" name="sexe" value="homme"> homme
        <br><br>

        <!-- Très bien : les deux boutons radio utilisent le même name. -->
    </div>

    <div>
        <label>Centre d'intérét :</label>
        <br>

        <input type="checkbox" name="Musique"> Musique
        <br>

        <input type="checkbox" name="Sport"> Sport
        <br><br>
    </div>

    <div>
        <label>Niveau d'études :</label>

        <select nom="Niveau d'études : ">
        <!-- Remarque : L'attribut "nom" n'existe pas. Il faut utiliser name="...". -->

            <option value=" ">--Choisissez--</option>
            <option value="Lycée">Lycée</option>
            <option value="Licence">Licence</option>
            <option value="Master">Master</option>

        </select>
        <br><br>
    </div>

    <DIV>
        <label>Pourqoui Vous inscrire ?</label>
        <br>

        <textarea name="message" placeholder="Expliquer ici" required></textarea>
        <br><br>
    </DIV>

    <button type="submit">S'inscrire</button>

    <button type="submit">Réinitialiser</button>
    <!-- Remarque : Le bouton "Réinitialiser" doit être type="reset" et non type="submit". -->

    <div>
        <h1>Image</h1>

        <figure>
            <img src="photo.avif" alt="imgage">
            <figcaption>Exemple de photo de profil</figcaption>
        </figure>

        <!-- Très bien : utilisation de figure et figcaption. -->
    </div>

    <div>
        <h1>Audio</h1>

        <audio controls>
            <source src="SoundHelix-Song-1.mp3" type="audio/mpeg">
        </audio>

        <!-- Très bien : le fichier audio est utilisé localement. -->
    </div>

    <div>
        <h1>Vidéo MP4</h1>

        <video controls>
            <source src="mov_bbb (2).mp4" type="video/MP4">
        </video>

        <!-- Remarque : Il est préférable d'écrire type="video/mp4" en minuscules. -->
    </div>

    <div>
        <h1>Liste des inscrits (exemple)</h1>

        <TABLE border="1">

            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Niveau</th>
                </tr>
            </thead>

            <body>
                <!-- Remarque importante : Dans un tableau, il faut utiliser <tbody> et non <body>. -->
                
                <tr>
                    <td>Amina</td>
                    <td>amina@mail.com</td>
                    <td>Licence</td>
                </tr>

                <tr>
                    <td>Yacine</th>
                    <!-- Remarque : Cette cellule commence avec <td>, elle doit donc être fermée avec </td> et non </th>. -->
                    <td>yacine@mail.com</td>
                    <td>Master</td>
                </tr>

            </body>

        </TABLE>
    </div>

    </forme>

    <!-- Remarque : Une fois la balise <form> corrigée, pensez à vérifier que tous les éléments du formulaire sont bien à l'intérieur. -->

    <!-- Remarque : Il manque également un commentaire HTML personnel, comme demandé dans le devoir. -->

    <!--  Félicitations !
         Très bon travail ! Vous avez intégré la majorité des éléments demandés : formulaire, différents types de champs, image, audio, vidéo et tableau.
         Vous avez également bien utilisé les boutons radio, les checkbox ainsi que figure et figcaption.
         Il reste quelques petites erreurs de syntaxe HTML à corriger, mais votre travail montre que vous avez bien compris les notions vues.
         Continuez vos efforts et faites attention aux petits détails du code. Bravo et bon courage pour la suite !  -->
    </main>

</body>
</html>
